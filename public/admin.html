<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin · GroupVerse</title>
<style>
  :root { --bg:#050510; --card:rgba(16,18,42,.62); --line:rgba(120,140,255,.16); --txt:#e8ecff; --dim:#8b93c7; --cyan:#00f0ff; --bad:#ff4d6d; --ok:#2bd97c; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt); font-family:'Space Grotesk',system-ui,sans-serif; padding:1.2rem; max-width:860px; margin:0 auto; }
  h1 { font-family:Orbitron,sans-serif; font-size:1.2rem; letter-spacing:.06em; margin-bottom:1rem; background:linear-gradient(90deg,#00f0ff,#b537f2); -webkit-background-clip:text; background-clip:text; color:transparent; }
  input,select,button { font:inherit; color:var(--txt); background:rgba(10,12,34,.8); border:1px solid var(--line); border-radius:10px; padding:.55rem .8rem; }
  input:focus { outline:none; border-color:var(--cyan); }
  button { cursor:pointer; }
  .row { display:flex; gap:.6rem; margin-bottom:1rem; flex-wrap:wrap; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:1rem; margin-bottom:.7rem; }
  .card h3 { font-size:.95rem; margin-bottom:.3rem; }
  .muted { color:var(--dim); font-size:.8rem; }
  .acts { display:flex; gap:.4rem; margin-top:.6rem; flex-wrap:wrap; }
  .acts button { font-size:.78rem; padding:.4rem .8rem; }
  .ok { border-color:var(--ok); color:var(--ok); }
  .bad { border-color:var(--bad); color:var(--bad); }
  a { color:var(--cyan); }
</style>
</head>
<body>
<h1>⌬ GroupVerse Admin</h1>
<div class="row" id="loginRow">
  <input type="password" id="key" placeholder="Admin password">
  <button id="loginBtn">Unlock</button>
</div>
<div class="row" id="tabsRow" style="display:none">
  <select id="statusSel">
    <option value="pending">Pending review</option>
    <option value="approved">Approved (live)</option>
    <option value="rejected">Rejected</option>
    <option value="all">All</option>
  </select>
  <button id="reloadBtn">Refresh</button>
  <button class="bad" id="purgeBtn">Delete ALL demo groups</button>
</div>
<div class="card" id="waCard" style="display:none">
  <h3>WhatsApp link-reader session</h3>
  <div class="muted" id="waStatus">Checking…</div>
  <div class="row" id="waPairRow" style="margin-top:.6rem;align-items:center">
    <input id="waPhone" placeholder="Your WhatsApp number, e.g. 233501234567" style="flex:1;min-width:180px">
    <button id="waPairBtn">Get pairing code</button>
  </div>
  <div class="muted" id="waPairHelp" style="display:none;margin-top:.4rem"></div>
</div>
<div id="list"></div>
<p class="muted" style="margin-top:1rem"><a href="/">← Back to site</a></p>
<script>
let KEY = sessionStorage.getItem('gv-admin-key') || '';
let API = ''; // set to the public site's URL when this panel runs on its own host
const $ = (s) => document.querySelector(s);

async function init() {
  try { const cfg = await (await fetch('/api/config')).json(); if (cfg.publicApiBase) API = cfg.publicApiBase; } catch {}
  if (KEY) showPanel(); else showLogin();
}

async function load() {
  const status = $('#statusSel').value;
  const r = await fetch(API + '/api/admin/groups?status=' + status, { headers: { 'x-admin-key': KEY } });
  if (r.status === 401) { sessionStorage.removeItem('gv-admin-key'); KEY = ''; return showLogin(); }
  const d = await r.json();
  $('#list').innerHTML = d.items.length ? d.items.map(card).join('') : '<div class="card muted">Nothing here.</div>';
  wire();
}

function card(g) {
  const rep = g.reports ? ` · <b style="color:var(--bad)">${g.reports} reports</b>` : '';
  return `<div class="card" id="c-${g.id}">
    <h3>${esc(g.title)} <span class="muted">(${g.type}${g.isDemo ? ' · DEMO' : ''})</span></h3>
    <div class="muted">${g.category} · ${g.country} · ${g.language} · status: ${g.status}${rep}</div>
    <div class="muted" style="margin-top:.3rem;word-break:break-all">${esc(g.url)}</div>
    ${g.description ? `<p class="muted" style="margin-top:.4rem">${esc(g.description)}</p>` : ''}
    <div class="acts">
      ${g.status !== 'approved' ? `<button class="ok" data-act="approve" data-id="${g.id}">Approve</button>` : ''}
      ${g.status !== 'rejected' ? `<button class="bad" data-act="reject" data-id="${g.id}">Reject</button>` : ''}
      <button class="bad" data-act="delete" data-id="${g.id}">Delete</button>
      ${g.reports ? `<button data-act="reset-reports" data-id="${g.id}">Clear reports</button>` : ''}
    </div>
  </div>`;
}

function wire() {
  document.querySelectorAll('[data-act]').forEach((b) => b.addEventListener('click', async () => {
    await fetch(`${API}/api/admin/${b.dataset.id}/${b.dataset.act}`, { method: 'POST', headers: { 'x-admin-key': KEY } });
    load();
  }));
}

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function showLogin() { $('#loginRow').style.display = 'flex'; $('#tabsRow').style.display = 'none'; $('#list').innerHTML = ''; }
async function waRefresh() {
  try {
    const st = await (await fetch('/api/wa/status', { headers: { 'x-admin-key': KEY } })).json();
    const el = $('#waStatus');
    if (st.kind === 'linked') { el.innerHTML = 'Connected to <b>' + esc(st.phone || 'WhatsApp') + '</b> — reading real names and photos from invite links.'; $('#waPairRow').style.display = 'none'; $('#waPairHelp').style.display = 'none'; }
    else if (st.kind === 'pairing_code') { el.innerHTML = 'Enter this code in WhatsApp: <b style="font-size:1.2rem;color:var(--cyan)">' + esc(st.code) + '</b>'; $('#waPairRow').style.display = 'none'; const h = $('#waPairHelp'); h.style.display = 'block'; h.innerHTML = 'On that phone: WhatsApp → Settings → Linked devices → Link a device → <b>Link with phone number instead</b> → type the code. Expires in about a minute — tap "Get pairing code" again if it expires.'; }
    else if (st.kind === 'not_paired') { el.textContent = 'Not paired yet. Enter your number below to get a code.'; $('#waPairRow').style.display = 'flex'; }
    else if (st.kind === 'starting') { el.textContent = 'Starting…'; }
    else el.textContent = st.message || 'Unknown state';
  } catch { $('#waStatus').textContent = 'Pairing service unreachable'; }
}

function showPanel() { $('#loginRow').style.display = 'none'; $('#tabsRow').style.display = 'flex'; load(); waRefresh(); $('#waCard').style.display = 'block'; setInterval(waRefresh, 5000); }

$('#waPairBtn').addEventListener('click', async () => {
  const phone = $('#waPhone').value.trim();
  if (!phone) return alert('Enter your WhatsApp number first');
  $('#waStatus').textContent = 'Requesting code…';
  try {
    const r = await fetch('/api/wa/pair', { method: 'POST', headers: { 'content-type': 'application/json', 'x-admin-key': KEY }, body: JSON.stringify({ phone }) });
    const d = await r.json();
    if (d.error) $('#waStatus').textContent = d.error;
  } catch { $('#waStatus').textContent = 'Pairing service unreachable'; }
});

$('#loginBtn').addEventListener('click', async () => {
  KEY = $('#key').value;
  const r = await fetch(API + '/api/admin/groups?status=pending', { headers: { 'x-admin-key': KEY } });
  if (r.ok) { sessionStorage.setItem('gv-admin-key', KEY); showPanel(); }
  else alert('Wrong password');
});
$('#reloadBtn').addEventListener('click', load);
$('#statusSel').addEventListener('change', load);
$('#purgeBtn').addEventListener('click', async () => {
  if (!confirm('Delete every demo group?')) return;
  const d = await (await fetch(API + '/api/admin/groups?status=all', { headers: { 'x-admin-key': KEY } })).json();
  for (const g of d.items.filter((x) => x.isDemo)) {
    await fetch(`${API}/api/admin/${g.id}/delete`, { method: 'POST', headers: { 'x-admin-key': KEY } });
  }
  load();
});

init();
</script>
</body>
</html>
